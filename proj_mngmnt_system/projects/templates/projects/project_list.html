{% extends "base.html" %}

{% block title %}
My Projects
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            My Projects
        </h1>

        <a href="{% url 'projects:projects_add' %}"
           class="d-sm-inline-block btn btn-primary btn-icon-split">

            <span class="icon text-white-50">
                <i class="fas fa-plus"></i>
            </span>

            <span class="text">
                Add New
            </span>
        </a>
    </div>

    <!-- Projects List -->
    <div class="row">
        <div class="col-lg-6 mb-4">

            {% for project in projs %}
                {% if request.user.id == project.owner_id %}
                    <a href="{% url 'projects:projects_detail' project.id %}"
                    class="h6 mb-1 list-group-item list-group-item-action text-primary">
                        {{project.title}} | owner: {{project.owner}}
                    </a>
                {% endif %}
            {% endfor %}
        </div>
    </div>

</div>

{% endblock %}
